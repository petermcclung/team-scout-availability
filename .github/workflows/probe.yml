name: Availability probe

# Every five minutes (GitHub's schedule, often later) a run starts; each run
# checks Team Scout at the start of five consecutive minutes and commits the
# result to this repository.
# GitHub may start a scheduled run late when its service is busy; minutes no
# run covered are recorded as "not measured" and shown as coverage, never as up.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: availability-probe
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: node --test probe.test.mjs
      - name: Check Team Scout (five samples, one a minute)
        run: node probe.mjs
      - name: Commit the record
        run: |
          git config user.name "team-scout-availability-probe"
          git config user.email "probe@users.noreply.github.com"
          # Start from the latest record every attempt and re-apply this run's
          # samples (kept in .run-samples.json, untracked), so an overlapping run
          # never conflicts and no sample is lost.
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            node probe.mjs --apply .run-samples.json > /dev/null
            git add data summary.json
            if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
            git commit -q -m "probe: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::error::could not push the record after five tries"
          exit 1
